<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo | Entrega Certa</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header>
      <h1>Painel do Restaurante</h1>
      <a href="/">Voltar para vitrine</a>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Selecionar restaurante</h2>
        <select id="merchant-select"></select>

        <h3>Informações</h3>
        <form id="merchant-form">
          <input name="name" placeholder="Nome" required />
          <input name="category" placeholder="Categoria" required />
          <input name="delivery_fee" type="number" step="0.1" placeholder="Taxa de entrega" required />
          <input name="eta_minutes" type="number" placeholder="Tempo (min)" required />
          <input name="rating" type="number" step="0.1" placeholder="Avaliação" required />
          <button type="submit">Salvar comércio</button>
        </form>
      </section>

      <section class="card">
        <h2>Cardápio</h2>
        <form id="menu-form">
          <input name="name" placeholder="Nome do item" required />
          <input name="description" placeholder="Descrição / ingredientes" required />
          <input name="price" type="number" step="0.1" placeholder="Preço" required />
          <button type="submit">Adicionar item</button>
        </form>
        <div id="menu-list"></div>
      </section>

      <section class="card">
        <h2>Pedidos recebidos</h2>
        <div id="orders-list"></div>
      </section>
    </main>

    <p id="feedback"></p>
    <script src="admin.js"></script>
  </body>
</html>
